<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수리력 자동출제 · 수와 연산</title>
<style>
  :root{
    --ink:#202a3c; --ink-soft:#6b7689; --line:#e8ebf2;
    --bg1:#eef3ff; --bg2:#fdeef6; --card:#ffffff;
    --accent:#5b6ef5;            /* 기본 보라-파랑 */
    --right:#10b981; --right-bg:#e7faf2;
    --wrong:#f4516c; --wrong-bg:#fdeef1;
    --shadow:0 2px 6px rgba(40,50,90,.05), 0 12px 32px rgba(40,50,90,.08);
    /* 영역별 컬러 (기본값, JS가 --accent로 주입) */
    --a-num:#4f8cff; --a-muldiv:#9b6dff; --a-fracadd:#ff6fa5;
    --a-fracmul:#ff924c; --a-dec:#15bcc4; --a-mix:#36c98a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2)); background-attachment:fixed;
    color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased;
    padding:22px 18px; min-height:100vh;}
  .wrap{max-width:560px; margin:0 auto}

  header{padding:6px 4px 20px; text-align:center}
  .logo{display:inline-flex; align-items:center; gap:9px; background:#fff; padding:7px 16px 7px 12px;
    border-radius:999px; box-shadow:var(--shadow); font-weight:800; font-size:.92rem; letter-spacing:-.01em}
  .logo .dot{width:22px;height:22px;border-radius:7px;
    background:linear-gradient(135deg,#5b6ef5,#9b6dff); display:inline-block}
  .logo span{color:var(--accent)}
  h1{font-size:1.6rem; letter-spacing:-.03em; margin-top:14px; font-weight:800}
  .sub{color:var(--ink-soft); font-size:.9rem; margin-top:2px}

  /* 진행바 (문제 화면 상단) */
  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .pbar{flex:1; height:9px; border-radius:999px; background:#e8ebf2; overflow:hidden}
  .pbar i{display:block; height:100%; width:0; border-radius:999px;
    background:var(--accent); transition:width .35s ease}
  .pill{font-size:.82rem; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums;
    background:#fff; padding:5px 11px; border-radius:999px; box-shadow:var(--shadow); white-space:nowrap}
  .timer{font-variant-numeric:tabular-nums}

  .card{background:var(--card); border-radius:22px; box-shadow:var(--shadow);
    padding:26px 22px; margin-bottom:18px}

  .chiplabel{display:inline-block; font-size:.74rem; font-weight:800; letter-spacing:.01em;
    color:#fff; background:var(--accent); padding:5px 13px; border-radius:999px; margin-bottom:16px}
  .qtext{font-size:1.12rem; font-weight:700; letter-spacing:-.01em}
  .figure{margin:18px 0 22px; border-radius:16px; padding:26px 18px; text-align:center;
    font-size:1.9rem; font-weight:800; font-variant-numeric:tabular-nums; color:var(--accent);
    background:color-mix(in srgb, var(--accent) 9%, #fff);
    border:2px dashed color-mix(in srgb, var(--accent) 28%, #fff); letter-spacing:.01em}

  .opts{display:flex; flex-direction:column; gap:10px}
  .opt{display:flex; align-items:center; gap:13px; padding:15px 16px; border:2px solid var(--line);
    border-radius:15px; cursor:pointer; transition:transform .08s, border-color .12s, background .12s;
    font-size:1.05rem; font-weight:600; background:#fff}
  .opt:hover{border-color:color-mix(in srgb, var(--accent) 45%, #fff)}
  .opt:active{transform:scale(.99)}
  .opt .badge{flex:none; width:28px; height:28px; border-radius:9px; border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:800; color:var(--ink-soft)}
  .opt.sel{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 7%, #fff)}
  .opt.sel .badge{background:var(--accent); border-color:var(--accent); color:#fff}
  .opt.correct{border-color:var(--right); background:var(--right-bg)}
  .opt.correct .badge{background:var(--right); border-color:var(--right); color:#fff}
  .opt.incorrect{border-color:var(--wrong); background:var(--wrong-bg)}
  .opt.incorrect .badge{background:var(--wrong); border-color:var(--wrong); color:#fff}
  .opt.locked{cursor:default}

  .feedback{margin-top:18px; font-size:.95rem; font-weight:700; padding:13px 16px; border-radius:13px; display:none}
  .feedback.show{display:flex; align-items:center; gap:8px}
  .feedback.ok{background:var(--right-bg); color:#0a8f63}
  .feedback.no{background:var(--wrong-bg); color:#d63354}

  .row{display:flex; gap:11px; margin-top:18px}
  button.act{flex:1; border:none; border-radius:15px; padding:16px; font-size:1.05rem; font-weight:800;
    cursor:pointer; font-family:inherit; transition:filter .12s, transform .08s, opacity .12s}
  button.act:active{transform:scale(.98)}
  .primary{background:var(--accent); color:#fff; box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%, transparent)}
  .primary:hover{filter:brightness(1.06)}
  .primary:disabled{opacity:.4; cursor:default; box-shadow:none}
  .ghost{background:#eef1f8; color:var(--ink)}
  .ghost:hover{background:#e4e8f3}

  .setup label{display:block; font-size:.88rem; color:var(--ink); margin:0 0 8px; font-weight:700}
  .setup input{width:100%; padding:14px 15px; border:2px solid var(--line); border-radius:13px;
    font-size:1rem; font-family:inherit; margin-bottom:18px; background:#fafbff}
  .setup input:focus{outline:none; border-color:var(--accent); background:#fff}
  .areas{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px}
  .area{position:relative; border:2px solid var(--line); border-radius:15px; padding:14px 14px 14px 16px;
    cursor:pointer; transition:.12s; font-size:.95rem; font-weight:700; overflow:hidden; background:#fff}
  .area::before{content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--c)}
  .area:hover{border-color:color-mix(in srgb,var(--c) 40%,#fff); transform:translateY(-1px)}
  .area.on{border-color:var(--c); background:color-mix(in srgb,var(--c) 8%,#fff); color:var(--c)}
  .area small{display:block; font-weight:500; color:var(--ink-soft); font-size:.76rem; margin-top:3px}
  .area.on small{color:color-mix(in srgb,var(--c) 60%,var(--ink-soft))}

  .hidden{display:none}
  .done{text-align:center}
  .done .trophy{font-size:3rem; line-height:1; margin-bottom:6px}
  .done .big{font-size:3rem; font-weight:900; font-variant-numeric:tabular-nums;
    background:linear-gradient(135deg,#5b6ef5,#9b6dff); -webkit-background-clip:text;
    background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:-.02em}
  .done .pct{color:var(--ink-soft); font-weight:700; margin-top:2px}
  .timeSummary{color:var(--ink-soft); font-size:.9rem; margin:10px 0 6px}
  .breakdown{text-align:left; margin:20px 0 8px}
  .bd-row{display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:13px;
    background:#fafbff; margin-bottom:8px}
  .bd-dot{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
  .bd-name{flex:1; font-weight:700; font-size:.92rem}
  .bd-score{font-weight:800; font-size:.92rem; color:var(--c); font-variant-numeric:tabular-nums}
  .sent{font-size:.83rem; color:var(--ink-soft); margin-top:14px; min-height:1.2em}

  /* 모드 탭 */
  .modetabs{display:flex; gap:8px; background:#eef1f8; padding:5px; border-radius:14px; margin-bottom:20px}
  .modetab{flex:1; border:none; background:transparent; padding:11px; border-radius:10px;
    font-family:inherit; font-size:.95rem; font-weight:700; color:var(--ink-soft); cursor:pointer; transition:.12s}
  .modetab.on{background:#fff; color:var(--accent); box-shadow:var(--shadow)}
  .examnote{background:color-mix(in srgb,var(--accent) 7%,#fff);
    border:1.5px solid color-mix(in srgb,var(--accent) 22%,#fff); border-radius:13px;
    padding:14px 16px; font-size:.9rem; line-height:1.7; color:var(--ink); margin-bottom:18px}

  /* 정기시험 오답 리뷰 */
  .review{text-align:left; margin:6px 0 4px}
  .review h3{font-size:.95rem; font-weight:800; margin:18px 0 12px; color:var(--ink)}
  .rev-item{border:1.5px solid var(--line); border-radius:13px; padding:13px 15px; margin-bottom:10px}
  .rev-item.wrong{border-color:color-mix(in srgb,var(--wrong) 40%,#fff); background:var(--wrong-bg)}
  .rev-item.right{border-color:color-mix(in srgb,var(--right) 35%,#fff); background:var(--right-bg)}
  .rev-top{display:flex; align-items:center; gap:8px; font-size:.82rem; margin-bottom:7px}
  .rev-no{font-weight:800; color:var(--ink)}
  .rev-area{color:var(--ink-soft)}
  .rev-mark{margin-left:auto; font-weight:800; font-size:.9rem}
  .rev-mark.o{color:var(--right)} .rev-mark.x{color:var(--wrong)}
  .rev-q{font-weight:700; font-size:.98rem; margin-bottom:8px}
  .rev-ans{font-size:.88rem; line-height:1.7}
  .rev-ans .mine{color:var(--wrong); font-weight:700}
  .rev-ans .correct{color:var(--right); font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="dot"></span>중학교 3R's <span>수와 연산</span></div>
    <h1>수리력 도전!</h1>
    <div class="sub">영역을 골라 문제를 풀어보세요</div>
  </header>

  <!-- 시작 -->
  <div class="card setup" id="setup">
    <div class="modetabs">
      <button class="modetab on" id="tabPractice" onclick="setMode('practice')">연습 모드</button>
      <button class="modetab" id="tabExam" onclick="setMode('exam')">정기시험</button>
    </div>

    <label for="name">학번 / 이름</label>
    <input id="name" placeholder="예) 3101 홍길동" autocomplete="off">

    <!-- 연습 모드 전용 -->
    <div id="practicePane">
      <label>영역 선택 <span style="font-weight:500;color:var(--ink-soft)">· 여러 개 고르면 골고루 출제</span></label>
      <div class="areas" id="areaGrid"></div>
      <label for="count">문제 수</label>
      <input id="count" type="number" value="10" min="1" max="30">
      <button class="act primary" onclick="startQuiz()">시작하기</button>
    </div>

    <!-- 정기시험 모드 전용 -->
    <div id="examPane" class="hidden">
      <div class="examnote">
        6개 영역을 골고루 섞어 <b>25문항</b>을 출제합니다.<br>
        중간 채점 없이 <b>끝까지 푼 뒤 한 번에 채점</b>합니다.
      </div>
      <label for="examPw">시험 비밀번호</label>
      <input id="examPw" type="password" placeholder="선생님께 받은 번호" autocomplete="off" inputmode="numeric">
      <div id="pwError" style="color:var(--wrong); font-size:.82rem; margin:-8px 0 14px; display:none">비밀번호가 올바르지 않습니다.</div>
      <button class="act primary" onclick="startExam()">시험 시작</button>
    </div>

    <div id="connStatus" style="font-size:.78rem; margin-top:14px; text-align:center"></div>
  </div>

  <!-- 문제 -->
  <div class="card hidden" id="quiz">
    <div class="topbar">
      <div class="pbar"><i id="pbarFill"></i></div>
      <div class="pill" id="pillCount">1 / 10</div>
      <div class="pill"><span class="timer" id="pillTimer">0:00</span></div>
    </div>
    <div class="chiplabel" id="chiplabel"></div>
    <div class="qtext" id="qtext"></div>
    <div class="figure" id="figure"></div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback"></div>
    <div class="row">
      <button class="act primary" id="checkBtn" onclick="checkAnswer()" disabled>채점하기</button>
      <button class="act primary hidden" id="nextBtn" onclick="nextQuestion()">다음 문제</button>
    </div>
  </div>

  <!-- 완료 -->
  <div class="card hidden done" id="done">
    <div class="trophy">🎉</div>
    <div class="big" id="finalScore"></div>
    <div class="pct" id="finalPct"></div>
    <p class="timeSummary" id="timeSummary"></p>
    <div class="breakdown" id="breakdown"></div>
    <div class="review hidden" id="review"></div>
    <div class="row">
      <button class="act ghost" onclick="location.reload()">다시 풀기</button>
    </div>
    <div class="sent" id="sent"></div>
  </div>
</div>

<script>
/* ============================================================
   ★★★ 여기 한 줄만 바꾸면 끝! ★★★
   --------------------------------------------------------------
   구글 시트 Apps Script 배포 후 받은 웹앱 주소를
   아래 따옴표 "" 안에 그대로 붙여넣으세요.
   (https:// 부터 .../exec 까지 전체)

   예) const SHEET_URL = "https://script.google.com/macros/s/AKfy...XYZ/exec";

   비워두면 결과 저장 없이 채점만 작동합니다.
   ============================================================ */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbxNgjr6uNBC0Hw-eSUQzcjRBdreSdl5l00bgopR6DIK4r1oig-OOerPdgVptbLlZN0Y/exec";

/* ============================================================
   ② 공통 유틸
   ============================================================ */
const circled=['①','②','③','④','⑤'];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>b?gcd(b,a%b):a;

// 정답값(문자열)과 함께 그럴듯한 오답 4개를 만들어 5지선다 구성
function buildChoices(answer, distractFns){
  const set=new Set([answer]); let guard=0;
  while(set.size<5 && guard<80){
    const c=distractFns[rnd(0,distractFns.length-1)]();
    if(c!==null && c!==undefined && String(c)!==answer) set.add(String(c));
    guard++;
  }
  let pad=1;
  while(set.size<5){ set.add(String(answer)+''+''); set.add(answer+pad); pad++; }
  const opts=shuffle([...set].slice(0,5));
  return {opts, idx:opts.indexOf(answer)};
}

// 한글 수 읽기 (1·2장용)
const _h=['','일','이','삼','사','오','육','칠','팔','구'], _u=['','십','백','천'], _b=['','만','억'];
function readKorean(n){
  if(n===0)return'영'; let p=[],ui=0,num=n;
  while(num>0){const c=num%10000; if(c>0)p.unshift(readChunk(c)+_b[ui]); num=Math.floor(num/10000); ui++;}
  return p.join(' ');
}
function readChunk(n){let s='';for(let i=3;i>=0;i--){const d=Math.floor(n/Math.pow(10,i))%10;if(d>0)s+=_h[d]+_u[i];}return s;}

// 분수 표기
function frac(n,d){return `${n}/${d}`;}
function simplify(n,d){const g=gcd(n,d)||1;return [n/g,d/g];}

/* ============================================================
   ③ 영역(묶음) 정의 — 각 영역은 generators 배열을 가짐
      generator()는 {prompt, figure, options[], answer} 반환
   ============================================================ */
const AREAS = {
  num: {
    label:'자연수의 수와 비교', chapters:'1·2장', color:'#4f8cff',
    generators:[
      // 다섯 자리 수 읽기
      ()=>{
        const n=rnd(10000,99999), ans=readKorean(n);
        const {opts,idx}=buildChoices(ans,[
          ()=>readKorean(n).replace(/만/,''),
          ()=>readKorean(n).replace(/천/,'백'),
          ()=>readKorean(n+rnd(1,9)*1000),
          ()=>readKorean(n-rnd(1,9)*100),
          ()=>readKorean(Math.floor(n/10)*10),
        ]);
        return {prompt:'다음 수를 바르게 읽은 것은?', figure:String(n), options:opts, answer:idx};
      },
      // 크기 비교 (가장 큰/작은 수)
      ()=>{
        const arr=Array.from({length:5},()=>rnd(10000,99999));
        const biggest=Math.max(...arr);
        const opts=arr.map(String), idx=arr.indexOf(biggest);
        return {prompt:'다음 중 가장 큰 수는?', figure:'아래 보기에서 고르세요', options:opts, answer:idx};
      },
    ]
  },
  muldiv: {
    label:'자연수 곱셈·나눗셈', chapters:'3·4·5·24장', color:'#9b6dff',
    generators:[
      // (세 자리)×(두 자리)
      ()=>{
        const a=rnd(100,999), b=rnd(11,99), ans=a*b;
        const {opts,idx}=buildChoices(String(ans),[
          ()=>ans+rnd(1,9)*10, ()=>ans-rnd(1,9)*10,
          ()=>a*(b+1), ()=>a*(b-1), ()=>ans+a, ()=>ans-a,
        ]);
        return {prompt:'다음을 계산한 결과는?', figure:`${a} × ${b}`, options:opts, answer:idx};
      },
      // (세 자리)÷(두 자리), 나누어떨어지게
      ()=>{
        const b=rnd(11,40), q=rnd(5,30), a=b*q, ans=q;
        const {opts,idx}=buildChoices(String(ans),[
          ()=>q+1, ()=>q-1, ()=>q+2, ()=>q-2, ()=>q+rnd(3,6),
        ]);
        return {prompt:'다음 나눗셈의 몫은?', figure:`${a} ÷ ${b}`, options:opts, answer:idx};
      },
    ]
  },
  fracadd: {
    label:'분수의 덧셈·뺄셈', chapters:'6·7·8·18·19장', color:'#ff6fa5',
    generators:[
      // 분모 다른 분수 덧셈
      ()=>{
        const d1=rnd(2,6), d2=rnd(2,6), n1=rnd(1,d1-1), n2=rnd(1,d2-1);
        const L=d1*d2/gcd(d1,d2);
        let num=n1*(L/d1)+n2*(L/d2), den=L;
        const [sn,sd]=simplify(num,den), ans=frac(sn,sd);
        const {opts,idx}=buildChoices(ans,[
          ()=>frac(n1+n2,d1+d2),          // 분자분모 그냥 더하기(흔한 오답)
          ()=>frac(sn+1,sd), ()=>frac(sn,sd+1),
          ()=>frac(num,den), ()=>frac(sn+sd,sd),
        ]);
        return {prompt:'다음을 계산하여 기약분수로 나타내면?', figure:`${frac(n1,d1)} + ${frac(n2,d2)}`, options:opts, answer:idx};
      },
      // 진분수 뺄셈(같은 분모)
      ()=>{
        const d=rnd(4,9), n1=rnd(2,d-1), n2=rnd(1,n1-1);
        const [sn,sd]=simplify(n1-n2,d), ans=frac(sn,sd);
        const {opts,idx}=buildChoices(ans,[
          ()=>frac(n1-n2,d), ()=>frac(sn+1,sd),
          ()=>frac(n1+n2,d), ()=>frac(sn,sd+1), ()=>frac(n2-1,d),
        ]);
        return {prompt:'다음을 계산하여 기약분수로 나타내면?', figure:`${frac(n1,d)} − ${frac(n2,d)}`, options:opts, answer:idx};
      },
    ]
  },
  fracmul: {
    label:'분수의 곱셈·나눗셈', chapters:'20·21·22·25·27·28장', color:'#ff924c',
    generators:[
      // (진분수)×(진분수)
      ()=>{
        const d1=rnd(2,6), d2=rnd(2,6), n1=rnd(1,d1-1), n2=rnd(1,d2-1);
        const [sn,sd]=simplify(n1*n2,d1*d2), ans=frac(sn,sd);
        const {opts,idx}=buildChoices(ans,[
          ()=>frac(n1*n2,d1+d2), ()=>frac(sn+1,sd),
          ()=>frac(n1+n2,d1*d2), ()=>frac(sn,sd+1), ()=>frac(n1*n2,d1*d2),
        ]);
        return {prompt:'다음을 계산하여 기약분수로 나타내면?', figure:`${frac(n1,d1)} × ${frac(n2,d2)}`, options:opts, answer:idx};
      },
      // (분수)÷(자연수)
      ()=>{
        const d=rnd(2,7), n=rnd(1,d-1), k=rnd(2,5);
        const [sn,sd]=simplify(n,d*k), ans=frac(sn,sd);
        const {opts,idx}=buildChoices(ans,[
          ()=>frac(n*k,d), ()=>frac(n,d+k),
          ()=>frac(sn+1,sd), ()=>frac(n,d*k+1), ()=>frac(sn,sd+2),
        ]);
        return {prompt:'다음을 계산하여 기약분수로 나타내면?', figure:`${frac(n,d)} ÷ ${k}`, options:opts, answer:idx};
      },
    ]
  },
  dec: {
    label:'소수 계산', chapters:'10·11·23·26·29·30장', color:'#15bcc4',
    generators:[
      // 소수 덧셈
      ()=>{
        const a=rnd(1,99)/10, b=rnd(1,99)/10;
        const ans=(Math.round((a+b)*10)/10).toFixed(1);
        const {opts,idx}=buildChoices(ans,[
          ()=>(parseFloat(ans)+0.1).toFixed(1), ()=>(parseFloat(ans)-0.1).toFixed(1),
          ()=>(parseFloat(ans)+1).toFixed(1), ()=>(a*b).toFixed(1), ()=>(parseFloat(ans)+0.2).toFixed(1),
        ]);
        return {prompt:'다음을 계산한 결과는?', figure:`${a.toFixed(1)} + ${b.toFixed(1)}`, options:opts, answer:idx};
      },
      // 소수 × 소수
      ()=>{
        const a=rnd(2,29)/10, b=rnd(2,19)/10;
        const ans=(Math.round(a*b*100)/100).toFixed(2);
        const {opts,idx}=buildChoices(ans,[
          ()=>(parseFloat(ans)+0.1).toFixed(2), ()=>(a*b*10).toFixed(2),
          ()=>(parseFloat(ans)-0.05).toFixed(2), ()=>(a+b).toFixed(2), ()=>(parseFloat(ans)+0.01).toFixed(2),
        ]);
        return {prompt:'다음을 계산한 결과는?', figure:`${a.toFixed(1)} × ${b.toFixed(1)}`, options:opts, answer:idx};
      },
    ]
  },
  mix: {
    label:'혼합 계산·약수배수', chapters:'12·13장', color:'#36c98a',
    generators:[
      // 혼합 계산 (곱셈 먼저)
      ()=>{
        const a=rnd(1,9), b=rnd(2,9), c=rnd(2,9), ans=a+b*c;
        const {opts,idx}=buildChoices(String(ans),[
          ()=>(a+b)*c, ()=>ans+1, ()=>ans-1, ()=>a*b+c, ()=>ans+c,
        ]);
        return {prompt:'다음을 계산한 결과는?', figure:`${a} + ${b} × ${c}`, options:opts, answer:idx};
      },
      // 최대공약수
      ()=>{
        const g=rnd(2,9), a=g*rnd(2,6), b=g*rnd(2,6);
        const ans=gcd(a,b);
        const {opts,idx}=buildChoices(String(ans),[
          ()=>ans+1, ()=>ans-1, ()=>ans*2, ()=>gcd(a,b)+rnd(2,4), ()=>a%b||2,
        ]);
        return {prompt:`${a}와(과) ${b}의 최대공약수는?`, figure:`${a},  ${b}`, options:opts, answer:idx};
      },
    ]
  },
};

/* ============================================================
   ④ 진행 상태 & 집계
   ============================================================ */
let total=0, idx=0, score=0, current=null, selected=-1, locked=false, studentName='';
let selectedAreas=[];
let perArea={};          // {areaKey:{solved, correct}}
let startTime=0, timerInt=null;
let mode='practice';     // 'practice' | 'exam'
let examQueue=[];        // 시험 모드: 미리 만든 문제 + 학생 선택 저장
const EXAM_PW='11618';   // 정기시험 비밀번호
// 정기시험 영역별 문항 배분 (합계 25)
const EXAM_PLAN={num:4, muldiv:4, fracadd:4, fracmul:4, dec:5, mix:4};

// 모드 전환
function setMode(m){
  mode=m;
  document.getElementById('tabPractice').classList.toggle('on', m==='practice');
  document.getElementById('tabExam').classList.toggle('on', m==='exam');
  document.getElementById('practicePane').classList.toggle('hidden', m!=='practice');
  document.getElementById('examPane').classList.toggle('hidden', m!=='exam');
  document.getElementById('pwError').style.display='none';
}

// 영역 선택 UI 생성
const grid=document.getElementById('areaGrid');
Object.entries(AREAS).forEach(([key,a])=>{
  const el=document.createElement('div');
  el.className='area'; el.dataset.key=key;
  el.style.setProperty('--c', a.color);
  el.innerHTML=`${a.label}<small>${a.chapters}</small>`;
  el.onclick=()=>{el.classList.toggle('on'); };
  grid.appendChild(el);
});

function startQuiz(){
  mode='practice';
  studentName=document.getElementById('name').value.trim()||'(이름없음)';
  selectedAreas=[...document.querySelectorAll('.area.on')].map(e=>e.dataset.key);
  if(selectedAreas.length===0) selectedAreas=Object.keys(AREAS); // 미선택 시 전체
  total=Math.max(1,Math.min(30,parseInt(document.getElementById('count').value)||10));
  idx=0; score=0; perArea={};
  selectedAreas.forEach(k=>perArea[k]={solved:0,correct:0});
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  startTime=Date.now();
  timerInt=setInterval(updateTimer,1000);
  loadQuestion();
}

function startExam(){
  // 비밀번호 확인
  const pw=document.getElementById('examPw').value.trim();
  if(pw!==EXAM_PW){
    document.getElementById('pwError').style.display='block';
    return;
  }
  mode='exam';
  studentName=document.getElementById('name').value.trim()||'(이름없음)';
  // 영역 배분대로 25문항 미리 생성 후 섞기
  examQueue=[];
  selectedAreas=Object.keys(EXAM_PLAN);
  perArea={}; selectedAreas.forEach(k=>perArea[k]={solved:0,correct:0});
  Object.entries(EXAM_PLAN).forEach(([key,n])=>{
    const area=AREAS[key];
    for(let i=0;i<n;i++){
      const gen=area.generators[rnd(0,area.generators.length-1)];
      const q=gen(); q.areaKey=key; q.picked=-1;
      examQueue.push(q);
    }
  });
  shuffle(examQueue);
  total=examQueue.length;
  idx=0; score=0;
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  startTime=Date.now();
  timerInt=setInterval(updateTimer,1000);
  loadQuestion();
}

function fmtTime(ms){
  const s=Math.floor(ms/1000), m=Math.floor(s/60);
  return `${m}:${String(s%60).padStart(2,'0')}`;
}

let currentAreaKey='';
function loadQuestion(){
  if(mode==='exam'){
    current=examQueue[idx];
    currentAreaKey=current.areaKey;
  }else{
    // 연습: 선택 영역을 돌아가며 출제
    currentAreaKey=selectedAreas[idx % selectedAreas.length];
    const area=AREAS[currentAreaKey];
    const gen=area.generators[rnd(0,area.generators.length-1)];
    current=gen();
  }
  const area=AREAS[currentAreaKey];
  document.documentElement.style.setProperty('--accent', mode==='exam' ? '#5b6ef5' : area.color);
  selected=(mode==='exam' ? current.picked : -1);
  locked=false;
  document.getElementById('chiplabel').textContent= mode==='exam'
    ? `정기시험 · ${idx+1}번` : `${area.label} · ${area.chapters}`;
  document.getElementById('qtext').textContent=current.prompt;
  document.getElementById('figure').textContent=current.figure;
  const box=document.getElementById('opts'); box.innerHTML='';
  current.options.forEach((opt,i)=>{
    const el=document.createElement('div');
    el.className='opt'+(mode==='exam'&&current.picked===i?' sel':''); el.dataset.i=i;
    el.innerHTML=`<span class="badge">${circled[i]}</span><span>${opt}</span>`;
    el.onclick=()=>selectOpt(i,el);
    box.appendChild(el);
  });
  document.getElementById('feedback').className='feedback';
  if(mode==='exam'){
    // 시험: 채점 버튼 숨기고, 이동 버튼만
    document.getElementById('checkBtn').classList.add('hidden');
    const nb=document.getElementById('nextBtn');
    nb.classList.remove('hidden');
    nb.textContent=(idx+1>=total)?'제출하기':'다음 문제';
    nb.disabled=false;
  }else{
    document.getElementById('checkBtn').classList.remove('hidden');
    document.getElementById('checkBtn').disabled=true;
    document.getElementById('nextBtn').classList.add('hidden');
  }
  updateProgress();
  updateTimer();
}

function selectOpt(i,el){
  if(mode==='exam'){
    current.picked=i; selected=i;
    document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
    el.classList.add('sel');
    return;
  }
  if(locked)return;
  selected=i;
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById('checkBtn').disabled=false;
}

function checkAnswer(){
  if(selected<0||locked)return;
  locked=true;
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('locked'));
  const ci=current.answer, ok=selected===ci;
  perArea[currentAreaKey].solved++;
  if(ok){score++; perArea[currentAreaKey].correct++;}
  const opts=document.querySelectorAll('.opt');
  opts[ci].classList.add('correct');
  if(!ok)opts[selected].classList.add('incorrect');
  const fb=document.getElementById('feedback');
  fb.className='feedback show '+(ok?'ok':'no');
  fb.textContent=ok?'✓ 정답입니다!':`✗ 오답이에요. 정답은 "${current.options[ci]}" 입니다.`;
  document.getElementById('checkBtn').classList.add('hidden');
  const nb=document.getElementById('nextBtn');
  nb.classList.remove('hidden');
  nb.textContent=(idx+1>=total)?'결과 보기':'다음 문제';
  updateProgress();
}

function nextQuestion(){
  if(mode==='exam'){
    idx++;
    if(idx>=total){ gradeExam(); return; }
    loadQuestion();
    return;
  }
  idx++; if(idx>=total){finish();return;} loadQuestion();
}

// 시험 모드: 끝까지 푼 뒤 한 번에 채점
function gradeExam(){
  score=0;
  selectedAreas.forEach(k=>perArea[k]={solved:0,correct:0});
  examQueue.forEach(q=>{
    const p=perArea[q.areaKey];
    p.solved++;
    if(q.picked===q.answer){ score++; p.correct++; }
  });
  finish();
}

function updateProgress(){
  const done=idx+(locked?1:0);
  document.getElementById('pillCount').textContent=`${idx+1} / ${total}`;
  document.getElementById('pbarFill').style.width=`${(done/total)*100}%`;
}
function updateTimer(){
  document.getElementById('pillTimer').textContent=fmtTime(Date.now()-startTime);
}

function finish(){
  clearInterval(timerInt);
  const elapsed=Date.now()-startTime;
  // 결과 화면은 기본 보라색 액센트로 복귀
  document.documentElement.style.setProperty('--accent', '#5b6ef5');
  document.getElementById('quiz').classList.add('hidden');
  const d=document.getElementById('done'); d.classList.remove('hidden');
  document.getElementById('finalScore').textContent=`${score} / ${total}`;
  document.getElementById('finalPct').textContent=
    (mode==='exam'?'📝 정기시험 · ':'')+`정답률 ${Math.round(score/total*100)}%`;
  document.getElementById('timeSummary').textContent=`⏱ 소요 시간 ${fmtTime(elapsed)} · 문항당 평균 ${(elapsed/1000/total).toFixed(1)}초`;
  // 영역별 집계 표 (색 점 + 점수)
  const bd=document.getElementById('breakdown'); bd.innerHTML='';
  selectedAreas.forEach(k=>{
    const p=perArea[k]; if(p.solved===0)return;
    const r=document.createElement('div'); r.className='bd-row';
    r.style.setProperty('--c', AREAS[k].color);
    r.innerHTML=`<span class="bd-dot"></span><span class="bd-name">${AREAS[k].label}</span><span class="bd-score">${p.correct} / ${p.solved}</span>`;
    bd.appendChild(r);
  });
  // 정기시험: 문항별 오답+정답 리뷰
  const rev=document.getElementById('review');
  if(mode==='exam'){
    rev.classList.remove('hidden');
    let html='<h3>📋 문항별 리뷰</h3>';
    examQueue.forEach((q,i)=>{
      const ok=q.picked===q.answer;
      const mine = q.picked>=0 ? `${circled[q.picked]} ${q.options[q.picked]}` : '(무응답)';
      const correct = `${circled[q.answer]} ${q.options[q.answer]}`;
      html+=`<div class="rev-item ${ok?'right':'wrong'}">
        <div class="rev-top">
          <span class="rev-no">${i+1}번</span>
          <span class="rev-area">${AREAS[q.areaKey].label}</span>
          <span class="rev-mark ${ok?'o':'x'}">${ok?'○ 정답':'✕ 오답'}</span>
        </div>
        <div class="rev-q">${q.prompt} <b>${q.figure}</b></div>
        <div class="rev-ans">${ok
          ? `정답 <span class="correct">${correct}</span>`
          : `내 답 <span class="mine">${mine}</span> · 정답 <span class="correct">${correct}</span>`}</div>
      </div>`;
    });
    rev.innerHTML=html;
  }else{
    rev.classList.add('hidden'); rev.innerHTML='';
  }
  sendResult(elapsed);
}

/* ============================================================
   ⑤ 결과 전송 — 영역별 집계 + 시간 포함
   ============================================================ */
// 초 → "1분 23초" / 1시간 넘으면 "1시간 5분 3초"
function fmtKorean(totalSec){
  const h=Math.floor(totalSec/3600);
  const m=Math.floor((totalSec%3600)/60);
  const s=totalSec%60;
  let out='';
  if(h>0) out+=`${h}시간 `;
  if(h>0||m>0) out+=`${m}분 `;
  out+=`${s}초`;
  return out.trim();
}
// 한국 시간 "2026-06-10 14:32" 형식
function fmtKST(d){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function sendResult(elapsed){
  const el=document.getElementById('sent');
  const sec=Math.round(elapsed/1000);
  const payload={
    name:studentName, score:score, total:total,
    mode:(mode==='exam'?'정기시험':'연습'),
    seconds:fmtKorean(sec),
    areas:selectedAreas.map(k=>`${AREAS[k].label}:${perArea[k].correct}/${perArea[k].solved}`).join(' | '),
    time:fmtKST(new Date())
  };
  if(!SHEET_URL){el.textContent='(저장 URL 미설정 — 채점만 작동)';return;}
  el.textContent='결과 저장 중…';
  fetch(SHEET_URL,{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)
  })
    .then(()=>el.textContent='✓ 결과가 저장되었습니다.')
    .catch(()=>el.textContent='저장 실패 — 네트워크를 확인하세요.');
}
</script>
